name: Format Issue 18 Sources
on:
  push:
    branches:
      - integrate/issue-18-runtime-gate-main
permissions:
  contents: write
jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[format-ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx biome check --write scripts/portaldot-runtime-probe.mjs scripts/portaldot-runtime-probe.test.mjs
      - name: Commit formatted code only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/portaldot-runtime-probe.mjs scripts/portaldot-runtime-probe.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(#18): biome-format Portaldot probe [format-ci]"
            git push origin HEAD:integrate/issue-18-runtime-gate-main
          fi
