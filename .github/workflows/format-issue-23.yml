name: Format Issue 23 Auth Sources
on:
  push:
    branches:
      - feat/issue-23-auth-security-foundation
permissions:
  contents: write
jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[format-ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx biome check --write apps/api/src/auth/session-security.ts apps/api/test/session-security.test.ts
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/auth/session-security.ts apps/api/test/session-security.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(#23): normalize auth foundation sources [format-ci]"
            git push origin HEAD:feat/issue-23-auth-security-foundation
          fi
