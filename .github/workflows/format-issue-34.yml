name: Normalize Issue 34 reviewer sources
on:
  push:
    branches:
      - feat/issue-34-verifier-safe-review-preflight
permissions:
  contents: write
jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[format-ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx biome check --write apps/api/src/reviews/verifier-preflight.ts apps/api/test/verifier-preflight.test.ts apps/web/app/verifier/page.tsx apps/web/app/verifier/verifier.module.css apps/web/tests/verifier-contract.test.mjs
      - name: Commit formatter changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/reviews apps/api/test/verifier-preflight.test.ts apps/web/app/verifier apps/web/tests/verifier-contract.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(#34): normalize reviewer sources [format-ci]"
            git push origin HEAD:feat/issue-34-verifier-safe-review-preflight
          fi
