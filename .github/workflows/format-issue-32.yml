name: Normalize Issue 32 Sponsor UI
on:
  push:
    branches:
      - feat/issue-32-read-only-sponsor-state
permissions:
  contents: write
jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[format-ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx biome check --write apps/web/app/sponsor/page.tsx apps/web/app/onboarding/page.tsx apps/web/tests/sponsor-state.test.mjs
      - name: Commit source format
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/sponsor/page.tsx apps/web/app/onboarding/page.tsx apps/web/tests/sponsor-state.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(#32): format sponsor workspace [format-ci]"
            git push origin HEAD:feat/issue-32-read-only-sponsor-state
          fi
