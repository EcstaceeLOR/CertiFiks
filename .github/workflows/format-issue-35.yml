name: Normalize Issue 35 dispute sources
on:
  push:
    branches:
      - feat/issue-35-dispute-case-ledger
permissions:
  contents: write
jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[format-ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx biome check --write apps/api/src/disputes/timeline.ts apps/api/test/dispute-timeline.test.ts apps/web/app/disputes/page.tsx apps/web/tests/dispute-contract.test.mjs
      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/disputes apps/api/test/dispute-timeline.test.ts apps/web/app/disputes apps/web/tests/dispute-contract.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(#35): normalize dispute UI and API [format-ci]"
            git push origin HEAD:feat/issue-35-dispute-case-ledger
          fi
