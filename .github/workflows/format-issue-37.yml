name: Normalize Issue 37
on:
  push:
    branches:
      - feat/issue-37-public-history-dashboard
permissions:
  contents: write
jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[format-ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx biome check --write apps/api/src/app.ts apps/api/src/bounties/public-bounties.ts apps/api/test/public-bounties.test.ts apps/web/app/dashboard apps/web/app/page.tsx apps/web/app/globals.css apps/web/tests/dashboard-contract.test.mjs
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/app.ts apps/api/src/bounties/public-bounties.ts apps/api/test/public-bounties.test.ts apps/web/app/dashboard apps/web/app/page.tsx apps/web/app/globals.css apps/web/tests/dashboard-contract.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(#37): normalize public dashboard formatting [format-ci]"
            git push origin HEAD:feat/issue-37-public-history-dashboard
          fi
