name: Format Issue 19 Sources
on:
  push:
    branches:
      - feat/issue-19-manifest-admission
permissions:
  contents: write
jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[format-ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx biome check --write packages/shared/src/manifest-admission.ts packages/shared/src/index.ts packages/shared/test/manifest-admission.test.ts protocol/vectors/manifest-tamper-v1.json
      - name: Commit format-only changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/shared/src/manifest-admission.ts packages/shared/src/index.ts packages/shared/test/manifest-admission.test.ts protocol/vectors/manifest-tamper-v1.json
          if ! git diff --cached --quiet; then
            git commit -m "style(#19): canonical biome formatting [format-ci]"
            git push origin HEAD:feat/issue-19-manifest-admission
          fi
