name: Normalize Issue 31 UI
on:
  push:
    branches:
      - feat/issue-31-design-system-onboarding
permissions:
  contents: write
jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[format-ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx biome check --write apps/web/app/page.tsx apps/web/app/onboarding/page.tsx apps/web/app/globals.css apps/web/app/layout.tsx apps/web/tests/design-contract.test.mjs
      - name: Commit only formatted UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app apps/web/tests/design-contract.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(#31): canonical design system formatting [format-ci]"
            git push origin HEAD:feat/issue-31-design-system-onboarding
          fi
