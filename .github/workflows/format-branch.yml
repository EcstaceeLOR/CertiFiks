name: Temporary formatting bootstrap (issue 4)
on:
  push:
    branches:
      - feat/issue-4-reproducible-bootstrap
    paths:
      - ".github/workflows/format-branch.yml"
permissions:
  contents: write
jobs:
  format-branch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply standard Biome formatting and safe lint fixes
        run: |
          npx biome check --write . || true
      - name: Commit generated formatting to exploration branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "style(#4): apply project-wide biome formatting"
            git push origin HEAD:feat/issue-4-reproducible-bootstrap
          fi
