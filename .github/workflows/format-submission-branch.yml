name: Temporary format issue 8 branch
on:
  push:
    branches: [feat/issue-8-submission-evidence]
    paths: [".github/workflows/format-submission-branch.yml"]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply Biome formatting
        run: npx biome check --write .
      - name: Commit formatted files to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "style(#8): format submission evidence checker"
            git push origin HEAD:feat/issue-8-submission-evidence
          fi
