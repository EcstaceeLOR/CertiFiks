name: Format Issue 20 Sources
on:
  push:
    branches:
      - feat/issue-20-authenticated-webhook-ingestion
permissions:
  contents: write
jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[format-ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx biome check --write apps/api/src/app.ts apps/api/src/github/webhook-auth.ts apps/api/src/github/webhook-journal.ts apps/api/test/github-webhook.test.ts
      - name: Commit formatted source code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/app.ts apps/api/src/github/webhook-auth.ts apps/api/src/github/webhook-journal.ts apps/api/test/github-webhook.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(#20): normalize webhook source formatting [format-ci]"
            git push origin HEAD:feat/issue-20-authenticated-webhook-ingestion
          fi
