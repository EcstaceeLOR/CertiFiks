name: Normalize Issue 40 E2E Gate
on:
  push:
    branches:
      - feat/issue-40-live-e2e-evidence-gate
permissions:
  contents: write
jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[format-ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx biome check --write scripts/quality/live-e2e-evidence.mjs scripts/quality/live-e2e-evidence.test.mjs scripts/quality/check-live-e2e-evidence.mjs
      - name: Commit formatter-only changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/quality/live-e2e-evidence.mjs scripts/quality/live-e2e-evidence.test.mjs scripts/quality/check-live-e2e-evidence.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(#40): canonical Biome formatting [format-ci]"
            git push origin HEAD:feat/issue-40-live-e2e-evidence-gate
          fi
