name: Temporary protocol formatter for issue 5
on:
  push:
    branches: [feat/issue-5-protocol-contracts]
    paths: [".github/workflows/format-protocol.yml"]
permissions:
  contents: write
jobs:
  format-protocol:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx biome check --write . || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "style(#5): normalize protocol and generated code formatting"
            git push origin HEAD:feat/issue-5-protocol-contracts
          fi
