name: Temporary format Issue 11 code
on:
  push:
    branches: [feat/issue-11-immutable-submission]
    paths: [".github/workflows/format-issue-11.yml"]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply pinned formatter and safe lint fixes
        run: |
          npx biome check --write apps/api/src/github/revision-verifier.ts apps/api/test/github-revision.test.ts || true
          npx biome format --write apps/api/src/github/revision-verifier.ts apps/api/test/github-revision.test.ts
      - name: Commit formatting to feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/github/revision-verifier.ts apps/api/test/github-revision.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(#11): apply pinned biome format and safe checks"
            git push origin HEAD:feat/issue-11-immutable-submission
          fi
