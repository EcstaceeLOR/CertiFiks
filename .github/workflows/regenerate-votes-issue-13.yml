name: Temporary regenerate EIP712 vote types
on:
  push:
    branches: [feat/issue-13-signed-attestations]
    paths: [".github/workflows/regenerate-votes-issue-13.yml"]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Regenerate typed vote API client from authoritative schema
        run: npm run protocol:generate
      - name: Format changed validation and tests
        run: npx biome format --write packages/shared/src/validation.ts packages/shared/test/protocol.test.ts
      - name: Commit generated files on issue branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(#13): generate typed EIP712 verifier vote schema and format checks"
            git push origin HEAD:feat/issue-13-signed-attestations
          fi
