name: Format Issue 25 Qualification
on:
  push:
    branches:
      - feat/issue-25-before-after-qualification
permissions:
  contents: write
jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[format-ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx biome check --write workers/verifier/src/qualification.ts workers/verifier/test/qualification.test.ts
      - name: Commit format-only changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/verifier/src/qualification.ts workers/verifier/test/qualification.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(#25): format deterministic qualification [format-ci]"
            git push origin HEAD:feat/issue-25-before-after-qualification
          fi
