name: CertiFiks continuous integration

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-quality:
    name: Node workspaces — lint / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Clean reproducible install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint and formatting verification
        run: |
          npx biome ci scripts/settlement/finalized-withdrawal.mjs scripts/settlement/finalized-withdrawal.test.mjs package.json --max-diagnostics=100
          npx biome ci .
      - name: Reject invalid Portaldot runtime / chain identity claims
        run: node --test scripts/portaldot-runtime-probe.test.mjs
      - name: Validate hackathon evidence ledger and truthfulness guards
        run: |
          node --test scripts/check-submission-readiness.test.mjs
          node scripts/check-submission-readiness.mjs
      - name: Verify protocol OpenAPI/types are generated and checked in
        run: npm run protocol:check
      - name: TypeScript checks
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Independent read-only manifest and evidence CLI acceptance
        run: node --import tsx --test scripts/verify-manifest.test.mjs scripts/verify-evidence.test.mjs scripts/check-public-api-contract.test.mjs
      - name: Reject false live E2E readiness and unscoped provider evidence
        run: node --test scripts/e2e/live-preflight.test.mjs
      - name: Reject fabricated live end-to-end release evidence
        run: node --test scripts/quality/live-e2e-evidence.test.mjs
      - name: Block unauthenticated security audit and unresolved high findings
        run: node --test scripts/security/independent-review-gate.test.mjs
      - name: Verify conservative unit economics and break-even model
        run: npm run economics:test && npm run economics:plan
      - name: Fail-closed finalized native payout receipt validation
        run: npm run payout:proof:test
      - name: Build every workspace
        run: npm run build

  historical-python-tests:
    name: Historical Python model (NOT production security approval)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s research/reference-model -p 'test_*.py' -v
      - name: Cross-language protocol hash vectors
        run: python research/reference-model/protocol_hash_reference.py

  solidity-baseline:
    name: Historical Solidity baseline — compile and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - name: Build source (does not certify security or Portaldot compatibility)
        working-directory: contracts
        run: forge build
      - name: Smoke tests (known design defects remain open in #6)
        working-directory: contracts
        run: forge test -vv

  settlement-adversarial:
    name: Stateful settlement invariants, gas and coverage (NOT audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - name: Run seeded stateful invariants and all regression tests
        working-directory: contracts
        run: |
          forge test --match-contract EscrowStatefulInvariantTest --fuzz-seed 0x17 -vv
          forge test -vv
      - name: Generate gas profiling and coverage evidence
        working-directory: contracts
        run: |
          forge test --gas-report
          forge coverage --report summary

  dependency-audit:
    name: Production dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: NPM high/critical production audit
        run: npm audit --audit-level=high --omit=dev

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  relational-db:
    name: PostgreSQL migration, tenancy, dedupe and restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: certifiks-ci-only-password
          POSTGRES_DB: certifiks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d certifiks_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply every migration on a clean database
        run: |
          for file in \
            scripts/db/ci_bootstrap.sql \
            supabase/migrations/202610150001_github_delivery_queue.sql \
            supabase/migrations/202610150002_github_delivery_leases.sql \
            supabase/migrations/202610260001_wallet_auth_foundation.sql \
            supabase/migrations/202610260002_lifecycle_tenancy.sql \
            supabase/migrations/202610260003_public_bounty_projection.sql \
            supabase/migrations/202610260004_chain_observation_ledger.sql \
            supabase/migrations/202610260005_verification_jobs.sql \
            supabase/migrations/202610260006_notification_delivery.sql \
            supabase/migrations/202610260007_workspace_delegation.sql \
            supabase/migrations/202610260008_sponsor_funding_intents.sql \
            supabase/migrations/202610260009_verifier_preflight.sql \
            supabase/migrations/202610260010_dispute_timeline.sql \
            supabase/migrations/202610260011_partner_keys.sql \
            supabase/migrations/202610270001_github_revision_receipts.sql \
            supabase/migrations/202610270002_verifier_independence.sql \
            scripts/db/ci_assertions.sql
          do
            docker run --rm --network host \
              -e PGPASSWORD=certifiks-ci-only-password \
              -v "$PWD:/repo:ro" postgres:16 \
              psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d certifiks_test -f "/repo/$file"
          done
      - name: Backup, recreate database and independently restore funded lifecycle
        run: |
          mkdir -p "$RUNNER_TEMP/certifiks-backup"
          docker run --rm --network host \
            -e PGPASSWORD=certifiks-ci-only-password \
            -v "$RUNNER_TEMP/certifiks-backup:/backup" postgres:16 \
            pg_dump -h 127.0.0.1 -U postgres -d certifiks_test -Fc -f /backup/lifecycle.dump
          docker run --rm --network host -e PGPASSWORD=certifiks-ci-only-password \
            postgres:16 createdb -h 127.0.0.1 -U postgres certifiks_restored
          docker run --rm --network host \
            -e PGPASSWORD=certifiks-ci-only-password \
            -v "$RUNNER_TEMP/certifiks-backup:/backup:ro" postgres:16 \
            pg_restore --no-owner --no-acl -h 127.0.0.1 -U postgres \
              -d certifiks_restored /backup/lifecycle.dump
          result=$(docker run --rm --network host -e PGPASSWORD=certifiks-ci-only-password \
            postgres:16 psql -tA -h 127.0.0.1 -U postgres -d certifiks_restored \
            -c "select (select count(*) from public.certifiks_bounties), (select count(*) from public.certifiks_attempts), (select count(*) from public.certifiks_audit_entries), (select count(*) from public.certifiks_public_bounties_v1);" -F '|')
          test "$result" = "2|1|1|1"
          rm -rf "$RUNNER_TEMP/certifiks-backup"


  browser-quality:
    name: Real Chromium mobile/desktop accessibility, recovery and performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CERTIFIKS_BROWSER_ORIGIN: "http://127.0.0.1:4100"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Reproducible workspace installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Pin browser automation and accessibility audit tools
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1 axe-core@4.10.3
      - name: Install Chromium and headless Linux dependencies
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Build the actual production website
        run: npm run build --workspace=@certifiks/web
      - name: Launch Next.js production server
        run: |
          ./node_modules/.bin/next start apps/web --port 4100 > "$RUNNER_TEMP/certifiks-web.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/certifiks-web.pid"
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:4100/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/certifiks-web.log"
          exit 1
      - name: Verify eight routes at desktop/mobile, WCAG, keyboard, offline and resource budgets
        run: node scripts/quality/browser-a11y.mjs
      - name: Upload actual browser screenshots and audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certifiks-browser-quality
          path: quality-artifacts/
          if-no-files-found: warn
          retention-days: 14
