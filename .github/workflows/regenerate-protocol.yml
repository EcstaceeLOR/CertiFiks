name: Temporary protocol regeneration after strict schema fix
on:
  push:
    branches: [feat/issue-5-protocol-contracts]
    paths: [".github/workflows/regenerate-protocol.yml"]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate OpenAPI from corrected JSON schemas and types
        run: npm run protocol:generate
      - name: Format source and code generation
        run: npx biome check --write . || true
      - name: Save generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(#5): synchronize revised strict schema, OpenAPI and client types"
            git push origin HEAD:feat/issue-5-protocol-contracts
          fi
