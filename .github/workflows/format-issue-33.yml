name: Format Issue 33 contributor search
on:
  push:
    branches:
      - feat/issue-33-verified-public-bounty-discovery
permissions:
  contents: write
jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[format-ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx biome check --write apps/api/src/bounties/public-bounties.ts apps/api/src/app.ts apps/api/test/public-bounties.test.ts apps/web/app/opportunities/page.tsx apps/web/app/onboarding/page.tsx apps/web/app/page.tsx apps/web/app/globals.css apps/web/tests/opportunities.test.mjs
      - name: Commit and push formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api apps/web
          if ! git diff --cached --quiet; then
            git commit -m "style(#33): normalize discovery source [format-ci]"
            git push origin HEAD:feat/issue-33-verified-public-bounty-discovery
          fi
