name: Normalize Issue 38 source
on:
  push:
    branches:
      - feat/issue-38-accessibility-resilience
permissions:
  contents: write
jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[format-ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx biome check --write apps/web/app/connectivity-notice.tsx apps/web/app/layout.tsx apps/web/app/error.tsx apps/web/app/not-found.tsx apps/web/app/dashboard/loading.tsx apps/web/app/dashboard/error.tsx scripts/quality/browser-a11y.mjs
      - name: Commit canonical style changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/connectivity-notice.tsx apps/web/app/layout.tsx apps/web/app/error.tsx apps/web/app/not-found.tsx apps/web/app/dashboard/loading.tsx apps/web/app/dashboard/error.tsx scripts/quality/browser-a11y.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(#38): normalize accessibility source formatting [format-ci]"
            git push origin HEAD:feat/issue-38-accessibility-resilience
          fi
