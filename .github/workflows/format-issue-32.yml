name: Format Issue 32 sponsor intent sources
on:
  push:
    branches:
      - feat/issue-32-atomic-sponsor-funding-intents
permissions:
  contents: write
jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[format-ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx biome check --write apps/api/src/bounties/sponsor-intent.ts apps/api/test/sponsor-intent.test.ts
      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/bounties/sponsor-intent.ts apps/api/test/sponsor-intent.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(#32): normalize funding-intent source [format-ci]"
            git push origin HEAD:feat/issue-32-atomic-sponsor-funding-intents
          fi
