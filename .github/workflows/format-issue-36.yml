name: Normalize Issue 36 wallet safety
on:
  push:
    branches:
      - feat/issue-36-truthful-wallet-tx-status
permissions:
  contents: write
jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[format-ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx biome check --write packages/shared/src/wallet-transaction-status.ts packages/shared/test/wallet-transaction-status.test.ts packages/shared/src/index.ts apps/web/app/wallet/page.tsx
      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/shared/src packages/shared/test/wallet-transaction-status.test.ts apps/web/app/wallet/page.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(#36): format wallet status code [format-ci]"
            git push origin HEAD:feat/issue-36-truthful-wallet-tx-status
          fi
